# =============================================================================
# Haraka SMTP Configuration, MTA on the server's own network
# =============================================================================
# Used by docker-compose.nmi-host.yml instead of config/smtp.ini.
#
# The MTA shares the server's network there, so it must not listen on every address:
# it listens only on the gateway address of NetSendo's Docker network, where the app
# containers reach it and nobody else does.

# NMI_MTA_HOST=10.58.0.1 and NMI_MTA_PORT=2525 in .env
listen=10.58.0.1:2525

# Connection limits
nodes=2
daemonize=false

# Timeouts
smtptimeout=300

# Queue directory
spool_dir=/opt/haraka/queue
