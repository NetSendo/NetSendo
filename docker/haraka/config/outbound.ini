; =============================================================================
; Haraka Outbound (direct delivery to the recipients' mail servers)
; =============================================================================
; Mail from a logged-in NetSendo session (netsendo_auth) is relayed: no queue
; plugin takes it, so Haraka's outbound delivers it to the MX of each recipient
; domain. Haraka 3 reads these keys at the top level of this file.
;
; Port 25 must be open for outgoing connections. Many cloud providers block it
; (Google Compute Engine always does); the NetSendo MTA dashboard shows whether
; this server can reach port 25.

; STARTTLS when the receiving server offers it (opportunistic)
enable_tls=true

; Parallel deliveries in all
concurrency_max=100

; Seconds to wait for a receiving server to answer the connection
connect_timeout=30

; Temporary failures (4xx, greylisting, server down) are retried for about
; 40 hours; after the last attempt the sender gets a bounce
temp_fail_intervals=5m,15m,30m,1h,2h,4h,8h*4

; Name in the Received header Haraka adds
received_header=NetSendo MTA
