# =============================================================================
# Haraka SMTP Configuration
# =============================================================================

# NetSendo decides the name each message is sent under (netsendo_outbound);
# config/me, written at start-up (docker-entrypoint.sh), is the name in the
# greeting and the Received header

# Listen on all interfaces of the container. NMI_MTA_LISTEN replaces this line,
# for the MTA on the server's own network (docs/NMI.md)
listen=[::]:25,[::]:587

# Connection limits
nodes=2
daemonize=false

# Timeouts
smtptimeout=300

# Queue directory
spool_dir=/opt/haraka/queue

# Log level: log.ini
