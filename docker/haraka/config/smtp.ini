# =============================================================================
# Haraka SMTP Configuration
# =============================================================================

# The name the MTA gives itself (HELO/EHLO) is config/me, written at start-up
# from NMI_HOSTNAME (docker-entrypoint.sh); without it, the container's hostname

# Listen on all interfaces
listen=[::]:25,[::]:587

# Connection limits
nodes=2
daemonize=false

# Timeouts
smtptimeout=300

# Queue directory
spool_dir=/opt/haraka/queue

# Log level: log.ini
