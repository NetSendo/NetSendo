# =============================================================================
# Haraka SMTP Configuration
# =============================================================================

# NetSendo decides the name each message is sent under (netsendo_outbound);
# config/me, written at start-up (docker-entrypoint.sh), is the name in the
# greeting and the Received header

# Listen on all interfaces of the container: 2525 is where NetSendo hands mail over,
# 25 and 587 for older setups. docker-compose.yml runs the MTA on the server's own
# network and replaces this line with NMI_MTA_LISTEN (10.58.0.1:2525), so it is not
# reachable from the internet
listen=[::]:25,[::]:587,[::]:2525

# One process: enough for NetSendo's volume, and small while NetSendo MTA is unused
nodes=0
daemonize=false

# Timeouts
smtptimeout=300

# Queue directory
spool_dir=/opt/haraka/queue

# Log level: log.ini
