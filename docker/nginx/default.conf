server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;
    client_max_body_size 100M;

    # Pages and API answers are compressed here; built assets have ready .gz files
    # (gzip_static below). A proxy in front usually talks HTTP/1.0 to this server, hence
    # gzip_http_version and gzip_proxied.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # Built scripts, styles and fonts carry a hash in their name: a new version is a new
    # file, so browsers may keep them for a year without asking again.
    location /build/assets/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Serve storage files directly from storage volume
    # This is necessary because Docker volumes don't support symlinks between them
    location /storage {
        alias /var/www/storage/app/public;
        try_files $uri $uri/ =404;
        # Enable caching for static assets
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Hidden files (.htaccess, .git, a stray .env) are never served. /.well-known/ is the
    # exception: the AI connector's discovery documents (/.well-known/oauth-*) are answered
    # by the application through "location /", and certificate checks use it too. A rule that
    # denies every dot path makes AI apps fail to find the sign-in (403).
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Resolved once, when nginx starts: docker-compose.yml restarts the webserver
        # whenever it recreates the app (depends_on ... restart: true)
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Room for larger response headers (Link preload headers, cookies);
        # the 4 KB default answers 502 when they grow past it.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        # Imports, exports and AI generation can take minutes
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
