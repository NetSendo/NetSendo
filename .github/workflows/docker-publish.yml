# =============================================================================
# NetSendo - Docker Image Build & Publish
# =============================================================================
# This workflow builds and publishes Docker images to GitHub Container Registry
# with proper version tags (latest, semver).
#
# Triggers:
#   - Push to main branch → publishes :latest and :sha-<commit>
#   - New version → release.yml dispatches this workflow on the tag vX.Y.Z,
#     which publishes :X.Y.Z, :X.Y and :X (a release created by release.yml
#     with GITHUB_TOKEN cannot fire `release: published` here)
#   - Release published by a person in the UI → same version tags
#   - Manual trigger → optional extra tag from the `version` input
#
# After a version image (tag vX.Y.Z) is pushed, notify-aderlo tells Aderlo,
# which hosts NetSendo Cloud, so the hosted instances get the new version
# without waiting for Aderlo's nightly registry check (aderlo-notify.yml).
# =============================================================================

name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'src/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-publish.yml'
  
  release:
    types: [published]
  
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra image tag (e.g. 2.2.1). Leave empty to tag by git ref only.'
        required: false
        default: ''
      security:
        description: 'On a vX.Y.Z tag: a security release, NetSendo Cloud updates at once instead of overnight.'
        type: boolean
        required: false
        default: false

# Builds of main publish :latest. A merge followed by the release commit used to build in
# parallel, and whichever finished last won: on 2026-11-08 the merge commit's image (still
# saying 2.8.1) overwrote the 2.8.2 one, so updated installations kept showing 2.8.1. A newer
# build of the same ref now cancels the older one; tags and dispatches have refs of their own.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels, annotations)
        id: meta
        uses: docker/metadata-action@v6
        # The image is multi-platform, so ghcr.io reads the package page's
        # description and licence from annotations on the image index, not from
        # labels (with labels only it showed no description and licence "Other").
        # Annotations go on each platform manifest and on the index.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # :latest comes only from the raw rule below (builds of main).
          # The default latest=auto would also add it to every semver build,
          # so building an older tag would move :latest back to that release.
          flavor: |
            latest=false
          tags: |
            # Set latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with version on release
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Manual version input (never defaults to latest: a dispatch on an
            # older tag must not move :latest back)
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
            # Short SHA for debugging
            type=sha,prefix=sha-
          # Override the defaults taken from the repository (its description,
          # and a licence GitHub cannot detect). Description max 512 characters.
          labels: |
            org.opencontainers.image.description=NetSendo - self-hosted email and SMS marketing automation (Laravel, Vue.js). Proprietary, source-available under the NetSendo EULA - not open source. Install guide: https://netsendo.com/en/docs/quickstart
            org.opencontainers.image.licenses=LicenseRef-NetSendo-EULA
            org.opencontainers.image.url=https://netsendo.com
          annotations: |
            org.opencontainers.image.description=NetSendo - self-hosted email and SMS marketing automation (Laravel, Vue.js). Proprietary, source-available under the NetSendo EULA - not open source. Install guide: https://netsendo.com/en/docs/quickstart
            org.opencontainers.image.licenses=LicenseRef-NetSendo-EULA

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}

      - name: Generate image summary
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Tells Aderlo (NetSendo Cloud hosting) about the new version right away
  # (aderlo-notify.yml; also startable by hand to send it again for a tag).
  notify-aderlo:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/aderlo-notify.yml
    with:
      tag: ${{ github.ref_name }}
      security: ${{ github.event.inputs.security == 'true' }}
    secrets:
      ADERLO_RELEASE_KEY: ${{ secrets.ADERLO_RELEASE_KEY }}
